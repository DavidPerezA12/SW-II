openapi: 3.0.3
info:
  title: API REST de videojuegos
  description: |
    API REST para consultar y gestionar videojuegos, desarrolladores, reviews y países relacionados con sus desarrolladores.

    La API utiliza MongoDB como almacenamiento principal. Los recursos `/games`, `/developers` y `/reviews`
    devuelven JSON. Los países se devuelven en XML desde `/countries` y `/games/{id}/country`.

    Los datos iniciales se cargan desde datasets incluidos en el repositorio. RAWG aporta videojuegos y
    desarrolladores en JSON; Wikidata aporta países en XML. La API puede funcionar aunque esas APIs externas
    no estén disponibles en el momento de la ejecución.
  version: 1.0.0
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: /
    description: Servidor actual. En local se usa normalmente http://localhost:3001.
security: []
tags:
  - name: Home
    description: Página inicial de la API
  - name: Games
    description: Operaciones sobre videojuegos
  - name: Developers
    description: Operaciones sobre desarrolladores
  - name: Reviews
    description: Operaciones sobre reviews
  - name: Countries
    description: Información en XML sobre países y desarrolladores
paths:
  /:
    get:
      tags:
        - Home
      operationId: getHome
      summary: Página de bienvenida
      description: Devuelve la página HTML con enlaces a los endpoints principales.
      responses:
        "200":
          description: Página inicial renderizada correctamente.
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /games:
    get:
      tags:
        - Games
      operationId: listGames
      summary: Obtener videojuegos
      description: Lista los videojuegos almacenados en MongoDB. Permite buscar, filtrar, ordenar y paginar resultados.
      parameters:
        - name: id
          in: query
          description: ID numérico del videojuego.
          schema:
            type: integer
            minimum: 1
          example: 3328
        - name: search
          in: query
          description: Texto a buscar en nombre o slug.
          schema:
            type: string
          example: the witcher
        - name: platform
          in: query
          description: Plataforma del videojuego.
          schema:
            type: string
          example: PC
        - name: genre
          in: query
          description: Género del videojuego.
          schema:
            type: string
          example: Action
        - name: store
          in: query
          description: Tienda en la que está disponible.
          schema:
            type: string
          example: Steam
        - name: minRating
          in: query
          description: Valoración mínima.
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 5
          example: 4.5
        - name: page
          in: query
          description: Número de página.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2
        - name: limit
          in: query
          description: Número máximo de resultados.
          schema:
            type: integer
            minimum: 1
            default: 1000
          example: 20
        - name: sort
          in: query
          description: "Campo de ordenación. Con guion inicial ordena de forma descendente. Campos permitidos: id, name, released, rating, metacritic, playtime."
          schema:
            type: string
          examples:
            ratingAsc:
              value: rating
            nameDesc:
              value: -name
      responses:
        "200":
          description: Lista de videojuegos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Games
      operationId: createGame
      summary: Crear videojuego
      description: Inserta un videojuego en la colección principal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "201":
          description: Videojuego creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
        "400":
          description: Faltan campos obligatorios o hay arrays vacíos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe un videojuego con ese ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /games/{id}:
    get:
      tags:
        - Games
      operationId: getGameById
      summary: Obtener videojuego por ID
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Videojuego encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Games
      operationId: updateGame
      summary: Actualizar videojuego
      description: Actualiza los campos admitidos de un videojuego existente.
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdate"
      responses:
        "200":
          description: Videojuego actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El cambio rompería recursos relacionados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Games
      operationId: deleteGame
      summary: Eliminar videojuego
      description: Elimina un videojuego de la colección principal si no tiene reviews, países o desarrolladores asociados.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Videojuego eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El videojuego tiene recursos relacionados y no puede eliminarse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /games/{id}/country:
    get:
      tags:
        - Games
        - Countries
      operationId: getGameCountries
      summary: Obtener países relacionados con un videojuego
      description: Devuelve en XML los países asociados a los desarrolladores de un videojuego. El XML tiene schema asociado en `docs/countries.xsd`.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Información de países en XML.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/CountriesXml"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /games/{id}/reviews:
    get:
      tags:
        - Games
        - Reviews
      operationId: getGameReviews
      summary: Obtener reviews de un videojuego
      description: Devuelve las reviews asociadas al videojuego indicado.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Reviews asociadas al videojuego.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameReviewsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /games/{id}/enriched:
    get:
      tags:
        - Games
      operationId: getEnrichedGame
      summary: Obtener videojuego enriquecido
      description: Devuelve el videojuego junto con sus reviews y los países asociados a sus desarrolladores.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Videojuego con datos relacionados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichedGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /developers:
    get:
      tags:
        - Developers
      operationId: listDevelopers
      summary: Obtener desarrolladores
      description: Lista los desarrolladores almacenados en MongoDB. Permite búsqueda, filtro por videojuego, ordenación y paginación.
      parameters:
        - name: search
          in: query
          description: Texto a buscar en nombre o slug.
          schema:
            type: string
          example: Valve
        - name: gameId
          in: query
          description: ID de un videojuego asociado al desarrollador.
          schema:
            type: integer
            minimum: 1
          example: 3328
        - name: page
          in: query
          description: Número de página.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2
        - name: limit
          in: query
          description: Número máximo de resultados.
          schema:
            type: integer
            minimum: 1
            default: 1000
          example: 20
        - name: sort
          in: query
          description: "Campo de ordenación. Con guion inicial ordena de forma descendente. Campos permitidos: id, name, slug, games_count."
          schema:
            type: string
          example: -games_count
      responses:
        "200":
          description: Lista de desarrolladores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopersListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Developers
      operationId: createDeveloper
      summary: Crear desarrollador
      description: Inserta un desarrollador en la colección de desarrolladores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperInput"
      responses:
        "201":
          description: Desarrollador creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDeveloperResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Algún videojuego asociado no existe en la base de datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe un desarrollador con ese ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /developers/{id}:
    get:
      tags:
        - Developers
      operationId: getDeveloperById
      summary: Obtener desarrollador por ID
      description: Busca un desarrollador por el ID numérico importado desde RAWG.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico del desarrollador.
          schema:
            type: integer
            minimum: 1
          example: 1612
      responses:
        "200":
          description: Desarrollador encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Developers
      operationId: updateDeveloper
      summary: Actualizar desarrollador
      description: Actualiza los campos admitidos de un desarrollador existente.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico del desarrollador.
          schema:
            type: integer
            minimum: 1
          example: 1612
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperUpdate"
      responses:
        "200":
          description: Desarrollador actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedDeveloperResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Developers
      operationId: deleteDeveloper
      summary: Eliminar desarrollador
      description: Elimina un desarrollador de la colección.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico del desarrollador.
          schema:
            type: integer
            minimum: 1
          example: 1612
      responses:
        "200":
          description: Desarrollador eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /reviews:
    get:
      tags:
        - Reviews
      operationId: listReviews
      summary: Obtener reviews
      description: Consulta las reviews guardadas en MongoDB, con filtros opcionales por ID y valoración.
      parameters:
        - name: id
          in: query
          description: ID numérico de la review.
          schema:
            type: integer
            minimum: 1
          example: 4
        - name: rating
          in: query
          description: Valoración de la review.
          schema:
            type: integer
            minimum: 1
            maximum: 5
          example: 5
        - name: page
          in: query
          description: Número de página.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2
        - name: limit
          in: query
          description: Número máximo de resultados.
          schema:
            type: integer
            minimum: 1
            default: 1000
          example: 20
      responses:
        "200":
          description: Lista de reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Reviews
      operationId: createReview
      summary: Crear review
      description: Registra una nueva review asociada a un videojuego existente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review creada correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: El videojuego asociado a la review no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya existe una review con ese ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /reviews/game/{gameId}:
    get:
      tags:
        - Reviews
      operationId: getReviewsByGame
      summary: Obtener reviews por videojuego
      description: Recupera las reviews vinculadas al videojuego indicado.
      parameters:
        - name: gameId
          in: path
          required: true
          description: ID numérico del videojuego.
          schema:
            type: integer
            minimum: 1
          example: 3328
      responses:
        "200":
          description: Reviews del videojuego.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsByGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /reviews/{id}:
    patch:
      tags:
        - Reviews
      operationId: updateReview
      summary: Actualizar review
      description: Modifica parcialmente una review usando su ID propio.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico de la review.
          schema:
            type: integer
            minimum: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdate"
      responses:
        "200":
          description: Review actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedReviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Reviews
      operationId: deleteReview
      summary: Eliminar review
      description: Borra la review identificada por su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID numérico de la review.
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: Review eliminada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /countries:
    get:
      tags:
        - Countries
      operationId: listCountries
      summary: Obtener países
      description: Devuelve en XML la relación entre videojuegos, desarrolladores y países. El XML tiene schema asociado en `docs/countries.xsd`.
      parameters:
        - name: country
          in: query
          description: Nombre del país.
          schema:
            type: string
          example: Poland
        - name: developer
          in: query
          description: Nombre del desarrollador.
          schema:
            type: string
          example: CD Projekt RED
        - name: gameName
          in: query
          description: Nombre del videojuego.
          schema:
            type: string
          example: "The Witcher 3: Wild Hunt"
      responses:
        "200":
          description: Información de países en XML.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/CountriesXml"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: ID numérico del videojuego.
      schema:
        type: integer
        minimum: 1
      example: 3328

  responses:
    BadRequest:
      description: Petición incorrecta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Game:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - platforms
        - genres
        - stores
      properties:
        id:
          type: integer
          minimum: 1
          example: 3328
        slug:
          type: string
          example: the-witcher-3-wild-hunt
        name:
          type: string
          example: "The Witcher 3: Wild Hunt"
        released:
          type: string
          nullable: true
          example: "2015-05-18"
        background_image:
          type: string
          nullable: true
          example: https://media.rawg.io/media/games/618/618c2031a07bbff6b4f611f10b6bcdbc.jpg
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          nullable: true
          example: 4.64
        metacritic:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          example: 92
        playtime:
          type: integer
          minimum: 0
          nullable: true
          example: 43
        platforms:
          type: array
          items:
            type: string
          example:
            - PC
            - PlayStation 4
        genres:
          type: array
          items:
            type: string
          example:
            - Action
            - RPG
        stores:
          type: array
          items:
            type: string
          example:
            - Steam
            - GOG
        esrb_rating:
          type: string
          nullable: true
          example: Mature
        developers:
          type: array
          nullable: true
          items:
            type: string
          example:
            - CD Projekt RED

    GameInput:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - platforms
        - genres
        - stores
      properties:
        id:
          type: integer
          minimum: 1
          example: 999999
        slug:
          type: string
          example: example-game
        name:
          type: string
          example: Example Game
        released:
          type: string
          example: "2026-01-01"
        background_image:
          type: string
          nullable: true
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 4.5
        metacritic:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          example: 85
        playtime:
          type: integer
          minimum: 0
          example: 12
        platforms:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          example:
            - PC
        genres:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          example:
            - RPG
        stores:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          example:
            - Steam
        esrb_rating:
          type: string
          nullable: true

    GameUpdate:
      type: object
      additionalProperties: false
      description: Campos admitidos en la actualización de un videojuego. No se actualiza el ID.
      properties:
        slug:
          type: string
        name:
          type: string
        released:
          type: string
        background_image:
          type: string
          nullable: true
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
        metacritic:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        playtime:
          type: integer
          minimum: 0
        platforms:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        genres:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        stores:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        esrb_rating:
          type: string
          nullable: true
        developers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    DeveloperGame:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: integer
          minimum: 1
          example: 4200
        slug:
          type: string
          example: portal-2
        name:
          type: string
          minLength: 1
          example: Portal 2
        added:
          type: integer
          example: 20858

    Developer:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - games
      properties:
        id:
          type: integer
          minimum: 1
          example: 1612
        name:
          type: string
          example: Valve Software
        slug:
          type: string
          example: valve-software
        games_count:
          type: integer
          minimum: 0
          example: 44
        image_background:
          type: string
          nullable: true
        games:
          type: array
          items:
            $ref: "#/components/schemas/DeveloperGame"

    DeveloperInput:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - games
      properties:
        id:
